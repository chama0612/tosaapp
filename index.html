<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kochi Cafe Map</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <div class="header__inner">
    <p class="header__sub">高知市のカフェを</p>
    <h1 class="header__title">タグで探す ☕</h1>
    <p class="header__desc">
      気分に合わせてタグを選ぶだけ。<br>
      コーヒー多めで並び替え表示されます。
    </p>
  </div>
</header>

<main class="container">

  <!-- タグエリア -->
  <section class="tags">
    <div class="tags__top">
      <h2 class="section-title">タグで絞り込み</h2>
      <button id="resetBtn" class="btn btn--ghost">
        リセット
      </button>
    </div>

    <div id="tagList" class="tag-list"></div>

    <div class="tags__status">
      <span id="activeTags">選択中：なし</span>
      <span>
        表示件数：<strong id="countText">0</strong>
      </span>
    </div>
  </section>

  <!-- カフェ一覧 -->
  <section class="cards">
    <h2 class="section-title">カフェ一覧</h2>

    <!-- カフェカード生成場所 -->
    <div id="cafeGrid" class="grid"></div>

    <!-- 検索結果なし表示 -->
    <p id="emptyState" hidden>
      該当するカフェがありません ☕
    </p>

  </section>

</main>

<footer class="footer">
  <p>
    ※掲載情報は変更される場合があります。<br>
    訪問前に公式情報も確認してください。
  </p>
</footer>

<script src="script.js"></script>
</body>
</html>
