<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kochi Cafe Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="bg-blur"></div>

  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="logo">☕︎</div>
        <div class="brand-text">
          <h1>Kochi Cafe Finder</h1>
          <p>アンケートで、あなた好みの高知市カフェを提案します。</p>
        </div>
      </div>
      <div class="badge">Kochi City</div>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <div class="panel-head">
        <h2>あなたの好み</h2>
        <p>チェックして「探す」を押すだけ。</p>
      </div>

      <div class="form-grid">
        <label class="chip">
          <input id="qCoffee" type="checkbox" />
          <span>コーヒー派</span>
        </label>

        <label class="chip">
          <input id="qTea" type="checkbox" />
          <span>紅茶派</span>
        </label>

        <label class="chip">
          <input id="qQuiet" type="checkbox" />
          <span>静かめ</span>
        </label>

        <label class="chip">
          <input id="qStudy" type="checkbox" />
          <span>作業/勉強向き</span>
        </label>

        <label class="chip">
          <input id="qSweets" type="checkbox" />
          <span>スイーツ</span>
        </label>

        <label class="chip">
          <input id="qLunch" type="checkbox" />
          <span>ランチ</span>
        </label>

        <label class="chip">
          <input id="qAesthetic" type="checkbox" />
          <span>映え</span>
        </label>

        <div class="keyword">
          <label for="qKeyword">キーワード（店名の一部でもOK）</label>
          <input id="qKeyword" type="text" placeholder="例：Lune / 帯屋町 / コーヒー…" />
        </div>

        <button id="searchBtn" class="search-btn" type="button">
          探す
          <span class="arrow">→</span>
        </button>
      </div>
    </section>

    <section class="panel results-panel">
      <div class="panel-head">
        <h2>おすすめカフェ</h2>
        <p>気になるお店はGoogleMapへ。</p>
      </div>

      <div id="results" class="results-grid">
        <!-- JSでカードが挿入されます -->
      </div>
    </section>

    <footer class="footer">
      <p>
        ※表示はアンケートに基づくおすすめです。営業状況はGoogleMapでご確認ください。
      </p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
