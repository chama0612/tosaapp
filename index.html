<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高知市カフェ検索</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="header">
    <div class="header__inner">
      <div class="brand">
        <div class="brand__icon">☕️</div>
        <div class="brand__text">
          <h1 class="brand__title">高知市カフェ図鑑</h1>
          <p class="brand__sub">個人店多め・お気に入りの一杯を見つけよう</p>
        </div>
      </div>

      <div class="header__chip">
        <span id="countText">0</span> 件
      </div>
    </div>
  </header>

  <main class="main">
    <!-- 検索・フィルター -->
    <section class="panel">
      <div class="panel__row">
        <label class="label">検索</label>
        <input id="searchInput" class="input" type="text"
          placeholder="店名 / エリア / 特徴で検索（例：帯屋町、落ち着く、モーニング）" />
      </div>

      <div class="panel__grid">
        <div class="panel__row">
          <label class="label">エリア</label>
          <select id="areaSelect" class="select">
            <option value="">すべて</option>
          </select>
        </div>

        <div class="panel__row">
          <label class="label">こだわり</label>
          <select id="tagSelect" class="select">
            <option value="">すべて</option>
          </select>
        </div>

        <div class="panel__row">
          <label class="label">並び替え</label>
          <select id="sortSelect" class="select">
            <option value="name_asc">名前順（A→Z）</option>
            <option value="name_desc">名前順（Z→A）</option>
          </select>
        </div>
      </div>

      <div class="panel__actions">
        <button id="resetBtn" class="btn btn--ghost">リセット</button>
        <button id="randomBtn" class="btn">今日のカフェを決める ✨</button>
      </div>
    </section>

    <!-- カード一覧 -->
    <section class="grid" id="cafeGrid"></section>

    <!-- 空表示 -->
    <section class="empty" id="emptyState" hidden>
      <div class="empty__card">
        <div class="empty__icon">🥲</div>
        <h2 class="empty__title">見つからなかった…</h2>
        <p class="empty__text">
          検索条件を少しゆるめてみてね。
        </p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>☕️ 高知市のカフェ探し（個人店多め）</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
