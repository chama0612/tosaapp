<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kochi Cafe Map - タグで探す</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="header__inner">
      <p class="header__sub">高知市内のカフェを</p>
      <h1 class="header__title">タグでさがす ☕️</h1>
      <p class="header__desc">
        気分に合わせてタグを選ぶだけ。<br />
        コーヒー多めのカフェ巡りをしよう。
      </p>
    </div>
  </header>

  <main class="container">

    <!-- タグ -->
    <section class="tags">
      <div class="tags__top">
        <h2 class="section-title">絞り込みタグ</h2>
        <button id="resetBtn" class="btn btn--ghost">リセット</button>
      </div>

      <div id="tagList" class="tag-list">
        <!-- JSで生成 -->
      </div>

      <div class="tags__status">
        <span id="activeTags" class="active-tags">選択中：なし</span>
        <span id="resultCount" class="result-count"></span>
      </div>
    </section>

    <!-- カード一覧 -->
    <section class="cards">
      <h2 class="section-title">お店一覧</h2>
      <div id="shopGrid" class="grid">
        <!-- JSで生成 -->
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>※掲載情報は変更される場合があります。訪問前に公式情報もご確認ください。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
